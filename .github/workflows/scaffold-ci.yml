name: Scaffold CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: scaffold-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check diff whitespace
        run: |
          git diff --check
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          fi

      - name: Check JSON and JavaScript syntax
        run: |
          python3 -m json.tool site/github-pages/site-data.json >/dev/null
          python3 -m json.tool docs/projects/four-relay-xbee-wifi/ui/manifest.json >/dev/null
          node --check site/github-pages/app.js
          node --check docs/projects/four-relay-xbee-wifi/ui/app.js

      - name: Run scaffold-audit unittest discovery
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/scaffold_audits -p 'test_*.py'

      - name: Run scaffold audits
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/scaffold_audit_agent_process.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/scaffold_audit_skills.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/scaffold_audit_records.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/git_publication_hygiene.py check --json
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/verify_scaffold.py

      - name: Run host-side contract tests
        run: |
          python3 -m py_compile scripts/*.py tests/four_relay_safe_core/run_host_tests.py
          python3 tests/four_relay_safe_core/run_host_tests.py
